name: Atualizar monitor de remuneracao

on:
  workflow_dispatch:

  schedule:
    - cron: "30 10 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "monitor-remuneracao-e-pages"
  cancel-in-progress: false

jobs:
  atualizar:
    name: Buscar, processar e publicar
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v7

      - name: Preparar o Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar ferramentas
        run: pip install -r requirements.txt

      - name: Executar o monitor
        run: python monitor.py

      - name: Salvar os resultados
        run: |
          git config user.name "Monitor Automatico"
          git config user.email "actions@github.com"

          git add docs/dados.json docs/remuneracoes.csv

          if git diff --cached --quiet; then
            echo "Nenhuma mudanca encontrada."
          else
            git commit -m "Atualizacao automatica da remuneracao"
            git push
          fi

      - name: Preparar arquivos do site
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
